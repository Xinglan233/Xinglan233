<svg xmlns="http://www.w3.org/2000/svg" width="800" height="332" viewBox="0 0 800 332" role="img" aria-labelledby="title description">
<title id="title">GitHub activity and language distribution</title>
<desc id="description">Public GitHub statistics. Rank uses the GitHub Readme Stats formula; languages are source-code byte shares, not proficiency. Exact figures appear in the README text table.</desc>
<rect x="0" y="0" width="800" height="332" rx="18" fill="#f6f7f9"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<text x="28" y="35" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="start">GitHub activity</text>
<text x="772" y="35" font-size="11" font-weight="400" fill="#62666d" text-anchor="end">Awaiting first sync</text>
<text x="28" y="111" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start">—</text>
<text x="28" y="135" font-size="12" font-weight="400" fill="#62666d" text-anchor="start">Commits · this year</text>
<text x="180" y="111" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start">—</text>
<text x="180" y="135" font-size="12" font-weight="400" fill="#62666d" text-anchor="start">Stars received</text>
<text x="28" y="196" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start">—</text>
<text x="28" y="220" font-size="12" font-weight="400" fill="#62666d" text-anchor="start">Pull requests</text>
<text x="180" y="196" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start">—</text>
<text x="180" y="220" font-size="12" font-weight="400" fill="#62666d" text-anchor="start">Issues opened</text>
<circle cx="352" cy="147" r="43" fill="none" stroke="#e0e4ea" stroke-width="4"/>
<text x="352" y="157" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle">—</text>
<text x="352" y="219" font-size="11" font-weight="400" fill="#62666d" text-anchor="middle">GRS rank</text>
<path d="M420 70V276" stroke="#dfe2e7"/>
<text x="452" y="83" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="start">Languages</text>
<defs><clipPath id="language-bar"><rect x="452" y="102" width="320" height="8" rx="4"/></clipPath></defs>
<rect x="452" y="102" width="320" height="8" rx="4" fill="#e0e4ea"/>
<text x="452" y="160" font-size="13" font-weight="400" fill="#62666d" text-anchor="start">No language data yet</text>
<text x="452" y="185" font-size="11" font-weight="400" fill="#62666d" text-anchor="start">Updated after the first sync.</text>
<text x="28" y="311" font-size="11" font-weight="400" fill="#62666d" text-anchor="start">Public code · language share by bytes</text>
</g>
</svg>
