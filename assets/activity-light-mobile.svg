<svg xmlns="http://www.w3.org/2000/svg" width="400" height="468" viewBox="0 0 400 468" role="img" aria-labelledby="title description">
<title id="title">GitHub activity and language distribution</title>
<desc id="description">Public GitHub statistics. Rank uses the GitHub Readme Stats formula; languages are source-code byte shares, not proficiency. Exact figures appear in the README text table.</desc>
<rect x="0" y="0" width="400" height="468" rx="18" fill="#f6f7f9"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<text x="24" y="32" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="start">GitHub activity</text>
<text x="24" y="55" font-size="11" font-weight="400" fill="#62666d" text-anchor="start">Awaiting first sync</text>
<text x="24" y="111" font-size="31" font-weight="600" fill="#1d1d1f" text-anchor="start">—</text>
<text x="24" y="135" font-size="11" font-weight="400" fill="#62666d" text-anchor="start">Commits · this year</text>
<text x="146" y="111" font-size="31" font-weight="600" fill="#1d1d1f" text-anchor="start">—</text>
<text x="146" y="135" font-size="11" font-weight="400" fill="#62666d" text-anchor="start">Stars received</text>
<text x="24" y="196" font-size="31" font-weight="600" fill="#1d1d1f" text-anchor="start">—</text>
<text x="24" y="220" font-size="11" font-weight="400" fill="#62666d" text-anchor="start">Pull requests</text>
<text x="146" y="196" font-size="31" font-weight="600" fill="#1d1d1f" text-anchor="start">—</text>
<text x="146" y="220" font-size="11" font-weight="400" fill="#62666d" text-anchor="start">Issues opened</text>
<circle cx="328" cy="147" r="35" fill="none" stroke="#e0e4ea" stroke-width="4"/>
<text x="328" y="157" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle">—</text>
<text x="328" y="219" font-size="11" font-weight="400" fill="#62666d" text-anchor="middle">GRS rank</text>
<path d="M24 247H376" stroke="#dfe2e7"/>
<text x="24" y="283" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="start">Languages</text>
<defs><clipPath id="language-bar"><rect x="24" y="300" width="352" height="8" rx="4"/></clipPath></defs>
<rect x="24" y="300" width="352" height="8" rx="4" fill="#e0e4ea"/>
<text x="24" y="352" font-size="13" font-weight="400" fill="#62666d" text-anchor="start">No language data yet</text>
<text x="24" y="377" font-size="11" font-weight="400" fill="#62666d" text-anchor="start">Updated after the first sync.</text>
<text x="24" y="448" font-size="11" font-weight="400" fill="#62666d" text-anchor="start">Public code · language share by bytes</text>
</g>
</svg>
